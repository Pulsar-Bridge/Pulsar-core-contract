[package]
name = "pulsar-core-contract"
version = "0.1.0"
edition = "2021"
description = "On-chain contract for Pulsar Bridge: tracks deposit transaction lifecycle and emits a versioned event schema for downstream consumers."
license = "Apache-2.0"
repository = "https://github.com/Pulsar-Bridge/Pulsar-core-contract"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
proptest = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
